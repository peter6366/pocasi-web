<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Widget grid</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f5f5f5;
}

/* základní layout */
.container {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  padding: 12px;
}

/* PORTRAIT = mobil / výška */
@media (orientation: portrait) {
  .container {
    grid-template-columns: 1fr;
  }
}

/* widget */
.box {
  aspect-ratio: 1 / 1;
  background: #e0e0e0;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(12px, 1.2vw, 18px);

  /* aby to na velkých monitorech nebylo extrémně široké */
  max-width: 240px;
  width: 100%;
  margin: 0 auto;

  transition: transform 0.15s ease, background 0.15s ease;
}

.box:hover {
  transform: translateY(-2px);
  background: #d6d6d6;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">1</div>
  <div class="box">2</div>
  <div class="box">3</div>
  <div class="box">4</div>
  <div class="box">5</div>
  <div class="box">6</div>
  <div class="box">7</div>
  <div class="box">8</div>
  <div class="box">9</div>
  <div class="box">10</div>
  <div class="box">11</div>
  <div class="box">12</div>
</div>

</body>
</html>
