<script>
const lat = 50.1045;
const lon = 14.3112;

function getWeatherIcon(pop, temp, hour, sunriseMin, sunsetMin) {

  const nowMin = hour * 60;
  const isNight = nowMin < sunriseMin || nowMin >= sunsetMin;

  // déšť má nejvyšší prioritu
  if (pop >= 50) {
    return isNight ? "🌧️🌙" : "🌧️";
  }

  // částečná oblačnost
  if (pop >= 20) {
    return isNight ? "☁️🌙" : "⛅";
  }

  // mráz / sníh
  if (temp <= 0) {
    return "❄️";
  }

  // jasno
  return isNight ? "🌙" : "☀️";
}

function getTempColor(temp) {
  if (temp <= 0) return "#00bfff";
  if (temp <= 10) return "#66ccff";
  if (temp <= 20) return "#ffd966";
  if (temp <= 30) return "#ff9933";
  return "#ff3300";
}

function getTextColor(bgColor) {
  if (bgColor === "#ffd966") return "#333";
  return "#fff";
}

async function loadWeather() {

  try {

    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,precipitation_probability&daily=sunrise,sunset&timezone=Europe%2FPrague`;

    const res = await fetch(url);
    const data = await res.json();

    const now = new Date();

    const times = data.hourly.time;
    const temps = data.hourly.temperature_2m;
    const pops = data.hourly.precipitation_probability;
    const precs = data.hourly.precipitation;

    const sunrise = new Date(data.daily.sunrise[0]);
    const sunset = new Date(data.daily.sunset[0]);

    // přesnější čas (minuty)
    const sunriseMin = sunrise.getHours() * 60 + sunrise.getMinutes();
    const sunsetMin = sunset.getHours() * 60 + sunset.getMinutes();

    let currentIndex = times.findIndex(t => new Date(t) >= now);
    currentIndex = Math.max(0, currentIndex);

    // datum
    const dateDiv = document.getElementById("date");

    const today = new Date(times[currentIndex]);

    const options = {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    };

    dateDiv.textContent =
      today.toLocaleDateString('cs-CZ', options);

    const container = document.getElementById("weather");
    container.innerHTML = "";

    for (let i = currentIndex; i < currentIndex + 6; i++) {

      if (!times[i]) break;

      const d = new Date(times[i]);

      const hourStr = `${d.getHours()}:00`;

      const temp = Math.round(temps[i]);
      const pop = Math.round(pops[i]);
      const prec = precs[i].toFixed(1);

      const bgColor = getTempColor(temp);
      const textColor = getTextColor(bgColor);

      const icon = getWeatherIcon(
        pop,
        temp,
        d.getHours(),
        sunriseMin,
        sunsetMin
      );

      container.innerHTML += `
        <div class="hour-row"
             style="background-color:${bgColor}; color:${textColor}">

          <div class="time">${hourStr}</div>

          <div class="icon">${icon}</div>

          <div class="temp">${temp}°C</div>

          <div class="precip">${prec} mm (${pop}%)</div>

        </div>
      `;
    }

  } catch (e) {

    console.error("Chyba při načítání počasí:", e);

    document.getElementById("weather").innerHTML =
      "Nepodařilo se načíst data.";
  }
}

loadWeather();
</script>
