<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Počasí Uhříněves</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    width: 340px;
    background: #ddd;
    border-radius: 16px;
    padding: 20px;

    display: flex;
    flex-direction: column;
    gap: 12px;

    text-align: center;
  }

  .city {
    font-size: 20px;
    font-weight: 600;
  }

  .time {
    font-size: 14px;
    opacity: 0.75;
  }

  .icon {
    font-size: 64px;
    line-height: 1;
  }

  .temp {
    font-size: 42px;
    font-weight: 700;
  }
</style>
</head>

<body>

<div class="card">
  <div class="city">Uhříněves</div>

  <div class="time" id="time">--:--:--</div>

  <div class="icon" id="icon">--</div>

  <div class="temp" id="temp">-- °C</div>
</div>

<script>
  // demo data (bez API)
  const weather = {
    condition: "cloudy", // sunny | cloudy | rain | snow
    temp: 6
  };

  function isNight() {
    const h = new Date().getHours();
    return (h < 6 || h >= 20);
  }

  function getIcon(condition, night) {
    if (condition === "sunny") return night ? "🌙" : "☀️";
    if (condition === "cloudy") return night ? "☁️🌙" : "☁️";
    if (condition === "rain") return night ? "🌧️🌙" : "🌧️";
    if (condition === "snow") return "❄️";
    return "❓";
  }

  function updateClock() {
    const now = new Date();
    document.getElementById("time").textContent =
      now.toLocaleTimeString("cs-CZ", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
  }

  function render() {
    const night = isNight();

    document.getElementById("icon").textContent =
      getIcon(weather.condition, night);

    document.getElementById("temp").textContent =
      weather.temp + " °C";
  }

  updateClock();
  render();

  setInterval(updateClock, 1000);
</script>

</body>
</html>
