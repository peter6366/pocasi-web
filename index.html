<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Počasí Uhříněves</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    width: 320px;
    background: #ddd;
    border-radius: 16px;
    padding: 20px;
    text-align: center;

    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .city {
    font-size: 20px;
    font-weight: 600;
  }

  .icon {
    font-size: 64px;
    line-height: 1;
  }

  .temp {
    font-size: 42px;
    font-weight: 700;
  }

  .desc {
    font-size: 14px;
    opacity: 0.75;
  }
</style>
</head>

<body>

<div class="card">
  <div class="city">Uhříněves</div>

  <div class="icon" id="icon">--</div>

  <div class="temp" id="temp">-- °C</div>

  <div class="desc" id="desc">Načítám...</div>
</div>

<script>
  // --- DEMO DATA (nahraď API) ---
  const weather = {
    condition: "cloudy", // sunny | cloudy | rain | snow
    temp: 6
  };

  // --- časová logika ---
  function isNight() {
    const hour = new Date().getHours();
    return (hour < 6 || hour >= 20);
  }

  // --- mapování ikon ---
  function getIcon(condition, night) {
    const map = {
      sunny: night ? "🌙" : "☀️",
      cloudy: night ? "☁️🌙" : "☁️",
      rain: night ? "🌧️🌙" : "🌧️",
      snow: "❄️"
    };

    return map[condition] || "❓";
  }

  // --- render ---
  const night = isNight();

  document.getElementById("icon").textContent =
    getIcon(weather.condition, night);

  document.getElementById("temp").textContent =
    weather.temp + " °C";

  document.getElementById("desc").textContent =
    night ? "Nocní režim" : "Denní režim";
</script>

</body>
</html>
