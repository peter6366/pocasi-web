<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grid s lokalitami</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
  }

  .wrapper {
    padding: 20px;
  }

  .grid {
    display: grid;
    gap: 16px;

    max-width: 1400px;
    margin: 0 auto;

    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }

  .box {
    background: #ddd;
    border-radius: 12px;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
    color: #111;
    text-align: center;

    padding: 10px;
    user-select: none;
  }

  .title {
    font-weight: 600;
  }

  .subtitle {
    font-size: 12px;
    opacity: 0.7;
  }

  @media (min-width: 1800px) {
    .grid {
      grid-template-columns: repeat(6, minmax(160px, 1fr));
    }
  }
</style>
</head>

<body>
  <div class="wrapper">
    <div class="grid">

      <div class="box">
        <div>
          <div class="title">Uhříněves</div>
          <div class="subtitle">Praha 22</div>
        </div>
      </div>

      <div class="box">
        <div>
          <div class="title">Kolovraty</div>
          <div class="subtitle">Praha</div>
        </div>
      </div>

      <div class="box">
        <div>
          <div class="title">Benice</div>
          <div class="subtitle">Praha</div>
        </div>
      </div>

      <div class="box">
        <div>
          <div class="title">Říčany</div>
          <div class="subtitle">Středočeský kraj</div>
        </div>
      </div>

      <div class="box">
        <div>
          <div class="title">Královice</div>
          <div class="subtitle">Praha</div>
        </div>
      </div>

      <div class="box">
        <div>
          <div class="title">Lipany</div>
          <div class="subtitle">Praha</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
