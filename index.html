<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responzivní grid</title>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  .wrapper {
    padding: 20px;
  }

  .grid {
    display: grid;

    /* automatické přizpůsobení počtu sloupců */
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));

    gap: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .box {
    background: #ddd;
    border-radius: 12px;

    /* čtvercový tvar */
    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    color: #111;
    user-select: none;
  }

  /* velké obrazovky – stabilní 6 sloupců */
  @media (min-width: 1600px) {
    .grid {
      grid-template-columns: repeat(6, 1fr);
    }
  }

  /* mobily – méně sloupců */
  @media (max-width: 600px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>

<body>
  <div class="wrapper">
    <div class="grid">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
      <div class="box">9</div>
      <div class="box">10</div>
      <div class="box">11</div>
      <div class="box">12</div>
    </div>
  </div>
</body>
</html>
